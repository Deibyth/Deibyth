<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A101F"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
    <clipPath id="clipRow1"><rect x="34" y="76" width="0" height="24"><animate attributeName="width" values="0;0;90;90" keyTimes="0;0.033;0.089;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipRow3"><rect x="34" y="150" width="0" height="24"><animate attributeName="width" values="0;0;165;165" keyTimes="0;0.244;0.322;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipRow5"><rect x="34" y="224" width="0" height="24"><animate attributeName="width" values="0;0;150;150" keyTimes="0;0.511;0.578;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="892" height="292" rx="14" fill="url(#cardGrad)" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.4" filter="url(#glow)"/>

  <!-- corner dot grid texture -->
  <g fill="#22D3EE" opacity="0.25">
    <circle cx="860" cy="270" r="1.6"/><circle cx="848" cy="270" r="1.6"/><circle cx="836" cy="270" r="1.6"/>
    <circle cx="860" cy="258" r="1.6"/><circle cx="848" cy="258" r="1.6"/><circle cx="836" cy="258" r="1.6"/>
    <circle cx="860" cy="246" r="1.6"/><circle cx="848" cy="246" r="1.6"/><circle cx="836" cy="246" r="1.6"/>
  </g>

  <!-- top bar -->
  <rect x="4" y="4" width="892" height="34" rx="14" fill="#0A101F"/>
  <rect x="4" y="24" width="892" height="14" fill="#0A101F"/>
  <circle cx="24" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="21" r="6" fill="#27C93F"/>
  <text x="450" y="26" text-anchor="middle" font-size="12" fill="#64748B" letter-spacing="0.5">deibyth@github — zsh — 90x24</text>
  <line x1="4" y1="38" x2="896" y2="38" stroke="#22D3EE" stroke-opacity="0.15"/>

  <!-- handle pill -->
  <g transform="translate(760,52)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="none" stroke="#A78BFA" stroke-width="1.2" filter="url(#glow)"/>
    <text x="55" y="18" text-anchor="middle" font-size="12" fill="#A78BFA">@Deibyth</text>
  </g>

  <!-- row 1: $ whoami -->
  <g clip-path="url(#clipRow1)">
    <text x="34" y="95" font-size="16">
      <tspan fill="#10B981">$ </tspan><tspan fill="#22D3EE">whoami</tspan>
    </text>
  </g>
  <!-- row 2 response -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.111;0.122;1" dur="9s" repeatCount="indefinite"/>
    <text x="34" y="125" font-size="17" font-weight="bold">
      <tspan fill="#A78BFA">&gt; </tspan><tspan fill="#F8FAFC">Deibith Alejandro</tspan>
    </text>
  </g>

  <!-- row 3: $ cat role.txt -->
  <g clip-path="url(#clipRow3)">
    <text x="34" y="169" font-size="16">
      <tspan fill="#10B981">$ </tspan><tspan fill="#22D3EE">cat role.txt</tspan>
    </text>
  </g>
  <!-- row 4 response -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.344;0.356;1" dur="9s" repeatCount="indefinite"/>
    <text x="34" y="199" font-size="15.5">
      <tspan fill="#A78BFA">&gt; </tspan><tspan fill="#E2E8F0">Backend Developer · AI Enthusiast · Automation Builder</tspan>
    </text>
  </g>

  <!-- row 5: $ echo $STATUS -->
  <g clip-path="url(#clipRow5)">
    <text x="34" y="243" font-size="16">
      <tspan fill="#10B981">$ </tspan><tspan fill="#22D3EE">echo $STATUS</tspan>
    </text>
  </g>
  <!-- row 6 response + cursor -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.611;1" dur="9s" repeatCount="indefinite"/>
    <text x="34" y="273" font-size="15.5">
      <tspan fill="#A78BFA">&gt; </tspan><tspan fill="#F8FAFC" font-weight="bold">Building + Learning + Shipping</tspan>
    </text>
    <rect x="330" y="261" width="9" height="16" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
