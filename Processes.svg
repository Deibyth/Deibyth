<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A101F"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="892" height="222" rx="14" fill="url(#cardGrad2)" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow2)"/>

  <!-- top bar -->
  <rect x="4" y="4" width="892" height="34" rx="14" fill="#0A101F"/>
  <rect x="4" y="24" width="892" height="14" fill="#0A101F"/>
  <circle cx="24" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="21" r="6" fill="#27C93F"/>
  <text x="450" y="26" text-anchor="middle" font-size="12" fill="#64748B" letter-spacing="0.5">$ ps aux --user=deibyth</text>
  <line x1="4" y1="38" x2="896" y2="38" stroke="#22D3EE" stroke-opacity="0.15"/>

  <!-- header row -->
  <text x="30" y="66" font-size="14" fill="#64748B" letter-spacing="0.5">PID    USER      %CPU   %MEM    UPTIME    COMMAND</text>
  <line x1="30" y1="76" x2="870" y2="76" stroke="#64748B" stroke-opacity="0.25"/>

  <!-- row 1 -->
  <text x="30" y="102" font-size="14.5">
    <tspan fill="#22D3EE">1001  </tspan><tspan fill="#A78BFA">deibyth   </tspan><tspan fill="#10B981">98.2   </tspan><tspan fill="#E2E8F0">512M    47d       </tspan><tspan fill="#F8FAFC" font-weight="bold">fastapi-projects</tspan><tspan fill="#94A3B8"> --watch</tspan>
  </text>

  <!-- row 2 -->
  <text x="30" y="128" font-size="14.5">
    <tspan fill="#22D3EE">1002  </tspan><tspan fill="#A78BFA">deibyth   </tspan><tspan fill="#10B981">87.4   </tspan><tspan fill="#E2E8F0">340M    12d       </tspan><tspan fill="#F8FAFC" font-weight="bold">mcp-server</tspan><tspan fill="#94A3B8"> --tools=llm-agents</tspan>
  </text>

  <!-- row 3 -->
  <text x="30" y="154" font-size="14.5">
    <tspan fill="#22D3EE">1003  </tspan><tspan fill="#A78BFA">deibyth   </tspan><tspan fill="#10B981">73.1   </tspan><tspan fill="#E2E8F0">290M    6d        </tspan><tspan fill="#F8FAFC" font-weight="bold">automation-daemon</tspan><tspan fill="#94A3B8"> --cron=*/whenever</tspan>
  </text>

  <!-- row 4 -->
  <text x="30" y="180" font-size="14.5">
    <tspan fill="#22D3EE">1004  </tspan><tspan fill="#A78BFA">deibyth   </tspan><tspan fill="#10B981">41.6   </tspan><tspan fill="#E2E8F0">128M    </tspan><tspan fill="#10B981">∞</tspan><tspan fill="#E2E8F0">         </tspan><tspan fill="#F8FAFC" font-weight="bold">curiosity.service</tspan><tspan fill="#94A3B8"> --restart=always</tspan>
  </text>

  <line x1="30" y1="195" x2="870" y2="195" stroke="#64748B" stroke-opacity="0.2"/>
  <text x="30" y="215" font-size="12.5" fill="#64748B">process curiosity.service is healthy · uptime: ∞</text>
  <circle cx="850" cy="211" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
